---
format_version: '8'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios
workflows:
  Prepare:
    steps:
    - activate-ssh-key:
        title: Activate the SSH Key
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone:
        title: Clone the repo
    - fastlane:
        title: Run fastlane certificates
        inputs:
        - lane: certificates
  Build-BasicSample:
    before_run:
    - Prepare
    steps:
    - xcode-archive:
        title: Archive the Xcode project
        inputs:
        - force_code_sign_identity: ''
        - force_team_id: ''
    - cache-pull:
        title: Downloading the build cache from bitrise.io, and moving the files back to their original place
    - deploy-to-bitrise-io:
        title: Deploy to bitrise
        inputs:
        - deploy_path: "$BITRISE_DEPLOY_DIR/BasicSample.ipa"
    envs:
    - opts:
        is_expand: false
      BITRISE_SCHEME: BasicSample
  Build-AdvancedSample:
    before_run:
    - Prepare
    steps:
    - xcode-archive:
        title: Archive the Xcode project
        inputs:
        - force_code_sign_identity: ''
        - force_team_id: ''
    - cache-pull:
        title: Downloading the build cache from bitrise.io, and moving the files back to their original place
    - deploy-to-bitrise-io:
        title: Deploy to bitrise
        inputs:
        - deploy_path: "$BITRISE_DEPLOY_DIR/AdvancedSample.ipa"
    envs:
    - opts:
        is_expand: false
      BITRISE_SCHEME: AdvancedSample
  Build-All:
    after_run:
    - Build-BasicSample
    - Build-AdvancedSample
    - Build-LocalNotificationSample
    - Build-BasicSwiftSample
    - Build-CustomInvitationSample
    - Build-ContactInvitationSample
  Build-LocalNotificationSample:
    before_run:
    - Prepare
    steps:
    - xcode-archive:
        title: Archive the Xcode project
        inputs:
        - force_code_sign_identity: ''
        - force_team_id: ''
    - cache-pull:
        title: Downloading the build cache from bitrise.io, and moving the files back to their original place
    - deploy-to-bitrise-io:
        title: Deploy to bitrise
        inputs:
        - deploy_path: "$BITRISE_DEPLOY_DIR/LocalNotificationSample.ipa"
    envs:
    - opts:
        is_expand: false
      BITRISE_SCHEME: LocalNotificationSample
  Build-CustomInvitationSample:
    before_run:
    - Prepare
    steps:
    - xcode-archive:
        title: Archive the Xcode project
        inputs:
        - force_code_sign_identity: ''
        - force_team_id: ''
    - cache-pull:
        title: Downloading the build cache from bitrise.io, and moving the files back to their original place
    - deploy-to-bitrise-io:
        title: Deploy to bitrise
        inputs:
        - deploy_path: "$BITRISE_DEPLOY_DIR/CustomInvitationSample.ipa"
    envs:
    - opts:
        is_expand: false
      BITRISE_SCHEME: CustomInvitationSample
  Build-ContactInvitationSample:
    before_run:
    - Prepare
    steps:
    - xcode-archive:
        title: Archive the Xcode project
        inputs:
        - force_code_sign_identity: ''
        - force_team_id: ''
    - cache-pull:
        title: Downloading the build cache from bitrise.io, and moving the files back to their original place
    - deploy-to-bitrise-io:
        title: Deploy to bitrise
        inputs:
        - deploy_path: "$BITRISE_DEPLOY_DIR/ContactInvitationSample.ipa"
    envs:
    - opts:
        is_expand: false
      BITRISE_SCHEME: ContactInvitationSample
  Build-BasicSwiftSample:
    before_run:
    - Prepare
    steps:
    - xcode-archive:
        title: Archive the Xcode project
        inputs:
        - force_code_sign_identity: ''
        - force_team_id: ''
    - cache-pull:
        title: Downloading the build cache from bitrise.io, and moving the files back to their original place
    - deploy-to-bitrise-io:
        title: Deploy to bitrise
        inputs:
        - deploy_path: "$BITRISE_DEPLOY_DIR/BasicSwiftSample.ipa"
    envs:
    - opts:
        is_expand: false
      BITRISE_SCHEME: BasicSwiftSample
app:
  envs:
  - opts:
      is_expand: false
    BITRISE_PROJECT_PATH: VerintSamples.xcworkspace
  - opts:
      is_expand: false
    BITRISE_SCHEME: BasicSample
  - opts:
      is_expand: false
    BITRISE_EXPORT_METHOD: development
  - git_url: https://github.com/foreseecode/mobile-fastlane-match
    opts:
      is_expand: false
meta:
  bitrise.io:
    stack: osx-xcode-26.0.x
    machine_type_id: g2.mac.large
